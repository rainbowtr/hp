<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:site_name" content="RAINBOW TREE">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/images/rainbow.svg" type="image/svg+xml">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
/* ─────────────────────────────────────────────────────────────
   デザインの起点は「ケアラベル（洗濯タグ）そのもの」。
   タグは冷たい生成りの生地に黒一色で刷られていて、色が無い。
   だからこの紙でも色は意味のあるところにしか置かない
   ＝○してよい／×いけない と、押せる物だけ。
   青(#1C6AAE)はアプリ（水滴のアイコン）から1色だけ引き継ぐ。
   ★会社サイトの配色(#fff6f4)は引き継がない。ここは会社案内ではなく道具。
   ───────────────────────────────────────────────────────────── */
:root{
  --stock:#F1F2EF;      /* タグ生地。暖色のクリームでなく、わずかに冷たい生成り */
  --print:#FFFFFF;      /* 刷り面。記号はここに黒で乗る */
  --ink:#14161A;        /* 刷りの黒。記号のSVGと同じ濃さに寄せる */
  --ink2:#5C6169;       /* 補助 */
  --ink3:#8D9198;       /* 出典など最小の文字 */
  --rule:#D8DBD5;       /* 罫。生地の色から起こす */
  --indigo:#1C6AAE;     /* 唯一のアクセント。水／藍。押せる物と現在地だけ */
  --indigo-pale:#E7F0F9;
  --do:#1F6B4A;         /* してよい */
  --dont:#A33222;       /* してはいけない（朱） */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stock);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  line-height:1.8;-webkit-text-size-adjust:100%;
  font-feature-settings:"palt" 1;}   /* 日本語の詰め。見出しの締まりが変わる */
img{max-width:100%}
a{color:var(--indigo)}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}

/* 見出し。派手な書体を足さず、太さと字間だけで性格を出す */
h1{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:40px 0 14px}
.lead{font-size:16px;margin:0 0 16px;max-width:64ch}
.counts{font-size:12.5px;color:var(--ink2);margin:0 0 26px}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:52px 0 14px;
  padding-left:12px;border-left:4px solid var(--indigo)}

/* 道具の帯。スクロールしても記号を絞り込める */
.tools{position:sticky;top:0;z-index:5;background:var(--stock);padding:12px 0 12px;
  border-bottom:1px solid var(--rule)}
.search{width:100%;padding:13px 14px;font-size:16px;font-family:inherit;
  border:1px solid var(--rule);border-radius:8px;background:var(--print);color:var(--ink)}
.search:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:transparent}
/* ★並び順は飾りでなく事実。タグの記号は左からこの順に並ぶので、絞り込みが凡例も兼ねる */
.legend{font-size:12px;color:var(--ink2);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--rule);background:var(--print);color:var(--ink);border-radius:6px;
  padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;line-height:1.2}
.chip:hover{border-color:var(--indigo)}
.chip:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* 記号の札。刷り面に黒い記号が乗っている状態をそのまま並べる */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:20px}
.card{display:flex;gap:16px;background:var(--print);border:1px solid var(--rule);
  border-radius:4px;padding:16px;scroll-margin-top:150px}
/* ★display:flex は UA の [hidden]{display:none} に勝つ。これが無いと絞り込みが画面上効かない */
.card[hidden]{display:none}
.card:target{border-color:var(--indigo);box-shadow:0 0 0 2px var(--indigo-pale)}
/* ★一番大きく張るのはここ。手元のタグ（2cm）と見比べる紙なので、記号は大きくないと仕事をしない */
.figure{flex:0 0 88px}
.figure img{width:88px;height:88px;display:block}
.body{min-width:0}
.tags{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:3px;
  background:var(--indigo-pale);color:var(--indigo)}
.tag.gen-old{background:#ECEDEA;color:var(--ink2)}
/* 数値そのものが答えになる項目（親等・命日からの日数）。等幅で「値」だと分かる形に */
.tag.badge{background:var(--ink);color:#fff;font-family:var(--mono);letter-spacing:0}
/* 図版を持たないデータ（分別・続柄・年忌）。記号が無いぶん見出しを主役にする。
   ★件数が多い（分別は537件）ので列を詰める。1枚が短いのに3列だと縦に伸びすぎる。
   ★.card.nofig(0,2,0) は .card[hidden](0,2,0) と同点で後勝ちしてしまうので、
     [hidden] 側を明示的に強くしておく（これが無いと絞り込みが効かない）。 */
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card.nofig{display:block;padding:13px 15px}
.card.nofig[hidden]{display:none}
.card.nofig h3{font-size:16px;margin:0 0 4px}
.card.nofig .plain{margin:0}
.card h3{font-size:15.5px;font-weight:700;margin:0 0 7px;line-height:1.5}
.meaning{font-size:14px;margin:0 0 6px}
.plain{font-size:13px;color:var(--ink2);margin:0 0 10px}
.actions{list-style:none;padding:0;margin:0 0 10px;font-size:13px;line-height:1.7}
.actions li{padding-left:19px;position:relative}
.actions li::before{position:absolute;left:0;font-size:12px}
.actions .do{color:var(--do)} .actions .do::before{content:"○"}
.actions .dont{color:var(--dont)} .actions .dont::before{content:"×"}
/* ★JIS番号は文章でなく仕様。等幅で組むと「規格の番号」だと一目で分かる */
.source{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--ink3);margin:0}
.empty{padding:32px;text-align:center;color:var(--ink2)}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:var(--print);
  border:1px solid var(--rule);font-size:14px}
td{border-top:1px solid var(--rule);padding:11px 12px;vertical-align:middle}
tr:first-child td{border-top:0}
.arrow{color:var(--ink3);text-align:center;width:2.5em}
.minicell{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);margin-right:14px}
.minicell img{width:36px;height:36px;flex:0 0 36px}

details{background:var(--print);border:1px solid var(--rule);border-radius:4px;
  padding:13px 15px;margin-bottom:9px}
summary{cursor:pointer;font-weight:700;font-size:15px;line-height:1.6}
summary:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
details div{padding-top:9px;font-size:14px;color:var(--ink2)}

.appbox{background:var(--print);border:1px solid var(--rule);border-radius:4px;
  padding:24px;margin:52px 0 24px;border-top:3px solid var(--indigo)}
.appbox h2{margin-top:0;border:0;padding:0;font-size:18px}
.appbox p{font-size:14px;margin:10px 0 16px;max-width:62ch}
/* ★App Store バッジは Apple 公式アセット。Identity Guidelines により
   加工・改色・効果は不可／高さ40px以上／周囲にバッジ高さの1/10以上の余白。 */
.appbadge{display:inline-block;line-height:0;padding:6px}
.appbadge img{height:54px;width:auto;display:block}
.appbadge:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

footer{margin:56px 0 44px;font-size:12px;color:var(--ink2);text-align:center;line-height:1.9}
footer a{color:var(--ink2)}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .figure{flex:0 0 72px}
  .figure img{width:72px;height:72px}
  .card{gap:13px;padding:14px}
  /* ★固定バーは狭いほど邪魔になる。チップが3段に折り返すと画面の半分近くを占めて、
     肝心の記号が見えなくなる。横1行のスクロールにして帯を薄く保つ。 */
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin:0 -16px;padding:0 16px 2px;scroll-padding-left:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .tools{padding:10px 0}
  .legend{margin:9px 0 7px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>{{H1}}</h1>
  <p class="lead">{{LEAD}}</p>
  <p class="counts">{{COUNTS}}</p>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="{{SEARCH_PLACEHOLDER}}" autocomplete="off">
    <p class="legend">{{LEGEND}}</p>
    <div class="chips" id="chips">
      <button class="chip" data-filter="all" data-value="all" aria-pressed="true">すべて</button>
      {{CHIPS}}
    </div>
  </div>

  <div class="{{GRID_CLASS}}" id="grid">
    {{CARDS}}
  </div>
  <p class="empty" id="empty" hidden>あてはまる記号が見つかりませんでした。別の言葉でお試しください。</p>

  {{MAPPING}}

  {{APPBOX}}

  <h2>よくある質問</h2>
  {{FAQ}}
</main>

<footer class="wrap">
  <p>{{FOOTNOTE}}</p>
  <p><a href="/">RAINBOW TREE 合同会社</a>　<a href="/privacy_policy.html">プライバシーポリシー</a></p>
</footer>

<script>
(function(){
  var q = document.getElementById('q');
  var chips = document.getElementById('chips');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var empty = document.getElementById('empty');
  var state = { cat: null, gen: null, text: '' };

  function apply(){
    var t = state.text.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function(c){
      var ok = true;
      if (state.cat && c.dataset.cat !== state.cat) ok = false;
      if (ok && state.gen && c.dataset.gen !== state.gen) ok = false;
      if (ok && t && c.dataset.q.toLowerCase().indexOf(t) === -1) ok = false;
      c.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown > 0;
  }

  q.addEventListener('input', function(){ state.text = q.value; apply(); });

  chips.addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if (!b) return;
    var f = b.dataset.filter, v = b.dataset.value;
    if (f === 'all') { state.cat = null; state.gen = null; }
    else if (f === 'cat') { state.cat = (state.cat === v) ? null : v; }
    else if (f === 'gen') { state.gen = (state.gen === v) ? null : v; }
    // 押下状態を状態から描き直す（トグル解除も正しく戻る）
    chips.querySelectorAll('.chip').forEach(function(x){
      var on = (x.dataset.filter === 'all') ? (!state.cat && !state.gen)
             : (x.dataset.filter === 'cat') ? (state.cat === x.dataset.value)
             : (state.gen === x.dataset.value);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    apply();
  });
})();
</script>
</body>
</html>
